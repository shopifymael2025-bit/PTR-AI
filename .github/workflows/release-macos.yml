# Builds the macOS versions of PTR AI on GitHub's Mac machines and attaches them to the release.
# Trigger: publishing a GitHub release (tag like v1.3.0), or manually from the Actions tab.
# One job on macos-latest builds both architectures:
#   PTR-AI-<version>-arm64.dmg (Apple Silicon) and PTR-AI-<version>-x64.dmg (Intel),
#   the matching .zip files and latest-mac.yml (used by PTR AI to detect new versions).
name: Release macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v1.3.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: onyx
    steps:
      # Release event: checks out the release tag. Manual run: checks out the branch it was started from.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onyx/package-lock.json

      - name: Check that the tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAGV=$(echo "$TAG" | sed -E 's/^[vV]//')
          if [ "$PKG" != "$TAGV" ]; then echo "::error::Tag $TAG does not match package.json version $PKG"; exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Add the Intel terminal module (the runner is Apple Silicon)
        run: |
          V=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@lydell/node-pty/package.json','utf8')).version")
          npm install --no-save --force "@lydell/node-pty-darwin-x64@$V" "@lydell/node-pty-darwin-arm64@$V"
          ls node_modules/@lydell

      - name: Type check and tests
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx vitest run

      - name: Build app
        run: |
          npm run icons
          npx electron-vite build

      - name: Package (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no paid Apple certificate: ad-hoc signature (identity "-")
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release upload "$TAG" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --clobber
